spring.application.name=casa-forno
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Puerto: la nube define PORT; en local usa 8080
server.port=${PORT:8080}

# Base de datos: en la nube se definen DB_URL, DB_USER y DB_PASS como variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/casaforno?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=${SHOW_SQL:false}
server.error.include-message=always
server.error.include-binding-errors=always
